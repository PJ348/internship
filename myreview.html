<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เด็กฝึกงาน.SE</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng {
            font-family: 'Sarabun', 'Inter', sans-serif;
        }

        .font-thai {
            font-family: 'Sarabun', 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F3F5F7] min-h-screen">
    <nav class="flex items-center justify-between px-4 md:px-8 py-4 bg-white border-b border-gray-100 sticky top-0 z-50">
        <!-- โลโก้ -->
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo" class="w-28 md:w-32 h-auto">
        </a>
        
        <!-- เมนูตรงกลาง (แสดงบนจอ md ขึ้นไป) -->
        <div class="relative md:flex items-center gap-8 text-gray-600 font-medium" id="nav-menu">
            <a href="./index.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Feed</a>
            <a href="./profile.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Profile</a>
            <div id="nav-indicator" class="absolute bottom-0 left-0 h-[2px] bg-emerald-600 transition-all duration-300 ease-out"></div>
        </div>
        
        <!-- ฝั่งขวา: Auth & ปุ่มเปิดเมนูกรอบมือถือ -->
        <div class="flex items-center gap-3 md:gap-4">
            <!-- ปุ่มเข้าสู่ระบบ -->
            <a href="./login.html" id="btn-login" class="hidden bg-[#10B981] hover:bg-emerald-600 text-white px-5 py-2 rounded-full font-bold text-sm transition">
                เข้าสู่ระบบ
            </a>
            
            <!-- ไอคอนโปรไฟล์ -->
            <a href="./profile.html" id="btn-profile" class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-gray-200 flex items-center justify-center text-gray-700 shrink-0 hover:bg-gray-300 transition">
                <i class="fa-regular fa-user text-base md:text-lg"></i>
            </a>
            
            <!-- ปุ่มออกจากระบบ -->
            <button id="btn-logout" class="hidden text-sm text-red-500 hover:text-red-700 font-medium cursor-pointer">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <main class="w-full h-full p-10 px-40 pb-48 z-0">
        <!-- ปุ่มย้อนกลับ (บริษัททั้งหมด) -->
        <a title="toallcompanybtn" href="./allCompany.html" class="font-thai inline-flex items-center gap-3 text-black/50 hover:text-gray-700 font-normal text-2xl transition-colors">
            <i class="fa-solid fa-chevron-left text-4xl font-extrabold"></i>
            บริษัททั้งหมด
        </a>

        <section class="flex flex-col lg:flex-row w-full mt-10 gap-6 items-start">
            <!--ฝั่งซ้าย-->
            <aside class="w-full lg:w-[600px] shrink-0">
                <!--image company-->
                <aside class="flex flex-col items-start bg-white w-full h-[525px] rounded-4xl gap-4 shadow-sm">
                    <img src="./img/บริษัท เก็ตออน เทคโนโลยี จำกัด.jpeg" alt="companyimage" class="rounded-t-4xl w-full h-[400px] object-cover"/>
                    <div class="pl-10 space-y-4 mt-2">
                        <p class="text-2xl font-medium font-thai">บริษัท เก็ตออน เทคโนโลยี จำกัด</p>
                        <span class="bg-[#10B981] text-white font-thai rounded-4xl px-4 py-2 font-semibold text-sm tracking-widest">ฝึกงาน</span>
                    </div>
                </aside>

                <aside class="flex flex-col bg-white w-full h-[357px] mt-5 rounded-4xl p-10 gap-8 shadow-sm items-center">
                    <h1 class="font-medium text-5xl font-eng">Overall Rating</h1>
                    <h1 class="font-extrabold text-7xl font-eng">5.0</h1>
                    <div class="flex gap-1 text-[#10B981] text-5xl">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <p class="text-sm font-eng font-medium text-black/30">Based on 128 Reviews</p>
                </aside>

                <aside class="flex flex-col bg-white w-full h-[191px] mt-5 rounded-4xl py-10 shadow-sm items-start pl-10">
                    <div class="space-y-4 font-thai">
                        <h3 class="text-2xl sm:text-3xl font-medium font-thai text-gray-900 mb-6">ข้อมูลติดต่อ</h3>
                        <div class="flex items-start gap-4">
                            <i class="fa-solid fa-location-dot text-2xl text-gray-400 shrink-0"></i>
                            <p class="text-sm sm:text-sm font-normal text-gray-400 leading-snug mt-1">9/196 ซอยรัชประชา 4 ถนนรัชดาภิเษก แขวงจตุจักร เขตจตุจักร กรุงเทพฯ 10900</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-user-check text-sm text-gray-400 shrink-0"></i>
                            <p class="text-sm sm:text-sm font-normal text-gray-400">ฝึกงานแล้ว 50 คน</p>
                        </div>
                    </div>
                </aside>

            </aside>

            <!--ฝั่งขวา-->
            <section class="flex-1 lg:w-[850px]">
                <div class="text-[40px] font-eng font-semibold z-10 mb-3">My Reviews</div>
                <!-- Container สำหรับรวมการ์ดทั้งหมด -->
                <aside class="space-y-4">
                    <!-- Card 1 -->
                    <div class="bg-white rounded-4xl w-full min-h-[947px] sm:p-8 border border-gray-100 shadow-sm">
                        <!--Review log-->
                    </div>

                </aside>

            </section>

        </section>

    </main>
</body>
</html>
