<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เด็กฝึกงาน.SE</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng {
            font-family: 'Sarabun', 'Inter', sans-serif;
        }

        .font-thai {
            font-family: 'Sarabun', 'Kanit', sans-serif;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-8 py-4 bg-white border-b border-gray-100 sticky top-0 z-50 bg-fixed">
        <!-- โลโก้ (กดกลับหน้าหลัก) -->
        <a href="./index.html"><img src="./img/logo.png" alt="Logo" class="w-32"></a>
        
        <!-- เมนูตรงกลาง พร้อมเส้นใต้สไลด์ -->
        <div class="relative hidden md:flex items-center gap-8 text-gray-600 font-medium" id="nav-menu">
            <!-- ใส่ href ให้ถูกต้อง -->
            <a href="./index.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Feed</a>
            <a href="./profile.html" class="nav-item text-emerald-600 pb-1 transition-colors">Profile</a>
            
            <div id="nav-indicator" class="absolute bottom-0 left-0 h-[2px] bg-emerald-600 transition-all duration-300 ease-out"></div>
        </div>
        
        <!-- Auth Container (สลับปุ่มตามสถานะล็อกอิน) -->
        <div class="flex items-center gap-4">
            <!-- ปุ่มเข้าสู่ระบบ -->
            <a href="./login.html" id="btn-login" class="bg-[#10B981] hover:bg-emerald-600 text-white px-6 py-2 rounded-full font-bold text-sm transition block">
                เข้าสู่ระบบ
            </a>
            
            <!-- ไอคอนโปรไฟล์ (ซ่อนไว้ก่อน จะแสดงเมื่อล็อกอินแล้วผ่าน TypeScript) -->
            <a href="./profile.html" id="btn-profile" class="hidden w-10 h-10 bg-gray-100 rounded-full items-center justify-center text-gray-500 hover:bg-gray-200 transition cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </a>
            
            <!-- ปุ่มออกจากระบบ (ซ่อนไว้ก่อนเช่นกัน) -->
            <button id="btn-logout" class="hidden text-sm text-red-500 hover:text-red-700 font-medium cursor-pointer">ออกจากระบบ</button>
        </div>
    </nav>

    <main class="bg-[#F3F5F7] w-screen h-full p-10 px-40 pb-48 z-0">
        <!-- ปุ่มย้อนกลับ (บริษัททั้งหมด) -->
        <div>
            <a href="./allCompany.html" class="font-thai inline-flex items-center gap-3 text-black/50 hover:text-gray-700 font-normal text-2xl transition-colors">
                <i class="fa-solid fa-chevron-left text-4xl font-extrabold"></i>
                บริษัททั้งหมด
            </a>
        </div>

        <div class="flex bg-black w-full h-screen mt-10">
            <div class="flex-col w-[600px]">
                <!--profile image-->
                <div class="flex flex-col items-center bg-white w-full h-[525px] rounded-4xl p-12 gap-5">
                    <img src="./img/profile.jpg" alt="profileimage" class="rounded-full size-[300px] object-cover"/>
                    <p class="text-2xl font-semibold font-thai mt-8">นายแฮมมี่ มหศัจรรศ์</p>
                    <tag class="bg-[#10B981] text-white font-thai rounded-4xl px-10 py-3 font-semibold text-[14px] tracking-widest">ฝึกงาน</tag>
                </div>

                <div class="flex flex-col bg-white w-full h-[373px] mt-5 rounded-4xl p-10">
                    <h1 class="text-2xl font-semibold font-eng">CONTACT INFORMATION</h1>
                </div>

            </div>
        </div>

    </main>
</body>
</html>
