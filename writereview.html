<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เด็กฝึกงาน.SE</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng { font-family: 'Inter', 'Sarabun', sans-serif; }
        .font-thai { font-family: 'Sarabun', 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-[#F3F5F7] min-h-screen font-thai text-gray-800">

    <!-- Header / Navbar -->
    <nav class="flex items-center justify-between px-8 md:px-16 py-4 bg-white border-b border-gray-100 sticky top-0 z-50">
        <!-- Logo -->
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo" class="w-28 md:w-32 h-auto">
        </a>
        
        <!-- Navigation Link -->
        <div class="flex items-center gap-10 font-medium">
            <a href="./index.html" class="relative py-1 text-gray-900 font-semibold after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-[3px] after:bg-[#10B981] after:rounded-full">Feed</a>
            <a href="./profile.html" class="text-gray-500 hover:text-emerald-600 transition-colors">Profile</a>
        </div>
        
        <!-- Profile Icon -->
        <a href="./profile.html" class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-300 transition">
            <i class="fa-regular fa-user text-base"></i>
        </a>
    </nav>

    <!-- Main Container -->
    <main class="max-w-[1536px] mx-auto px-8 md:px-16 py-8">
        <!-- Back Button -->
        <a title="toallcompanybtn" href="./allCompany.html" class="inline-flex items-center gap-3 text-gray-500 hover:text-gray-800 font-medium text-base mb-6 transition-colors ml-20 md:ml-24">
            <i class="fa-solid fa-chevron-left text-lg"></i>
            <span>บริษัททั้งหมด</span>
        </a>

        <!-- Review Form Card -->
        <div class="bg-white rounded-[28px] max-w-2xl mx-auto p-8 md:p-12 shadow-sm border border-gray-100">
            <!-- Header Title -->
            <div class="mb-6">
                <h1 class="text-3xl md:text-4xl font-extrabold font-eng text-gray-900 tracking-tight">Reviews</h1>
                <span class="text-xs font-semibold text-gray-400 font-eng tracking-wider mt-1 block">31 / 08 / 2026</span>
            </div>

            <form class="space-y-6">
                <!-- Field 1: Position -->
                <div>
                    <label for="internshipPosition" class="block text-gray-500 font-medium text-sm md:text-base font-eng mb-2">
                        Internship Position
                    </label>
                    <input 
                        id="internshipPosition"
                        type="text"
                        title="Internship Position"
                        placeholder="กรอกตำแหน่งฝึกงาน"
                        class="w-full bg-[#EFEFEF]/70 focus:bg-white border border-transparent focus:border-emerald-500 rounded-2xl p-4 text-gray-800 font-medium outline-none transition-all duration-200 shadow-inner"/>
                </div>

                <!-- Field 2: Overall Rating -->
                <div class="py-2 text-center">
                    <label class="block text-gray-500 font-medium text-sm md:text-base font-eng mb-4 text-left">
                        Overall Rating
                    </label>
                    <div class="flex flex-col items-center justify-center space-y-2">
                        <span class="text-5xl md:text-6xl font-extrabold font-eng text-gray-900 tracking-tight">0.0</span>
                        <div class="flex gap-2 text-3xl md:text-4xl text-gray-300 pt-1">
                            <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors"></i>
                            <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors"></i>
                            <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors"></i>
                            <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors"></i>
                            <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors"></i>
                        </div>
                    </div>
                </div>

                <!-- Field 3: Detailed Review -->
                <div>
                    <label for="detailedReview" class="block text-gray-500 font-medium text-sm md:text-base font-eng mb-2">
                        Detailed Review
                    </label>
                    <textarea 
                        id="detailedReview"
                        rows="4"
                        title="Detailed Review"
                        placeholder="กรอกรายละเอียดรีวิว"
                        class="w-full bg-[#EFEFEF]/70 focus:bg-white border border-transparent focus:border-emerald-500 rounded-2xl p-4 text-gray-800 font-medium outline-none transition-all duration-200 resize-none shadow-inner"
                    ></textarea>
                </div>

                <!-- Form Actions -->
                <div class="flex flex-row-reverse items-center gap-4 pt-4">
                    <a href="./companyreview.html" class="font-thai text-sm 2xl:text-base font-semibold text-white bg-[#10B981] hover:bg-emerald-600 rounded-full px-8 py-3 tracking-wider transition-colors inline-block shadow-sm">
                        บันทึก
                    </a>
                    <a href="./companyreview.html" class="font-thai text-sm 2xl:text-base font-semibold text-gray-600 hover:text-red-500 rounded-full px-6 py-3 tracking-wider transition-colors inline-block">
                        ยกเลิก
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
