<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in </title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng { font-family: 'Sarabun', 'Inter', sans-serif; }
        .font-thai { font-family: 'Sarabun', 'Kanit', sans-serif; }
    </style>
</head>
<body class="font-thai">

    <section class="relative w-full h-screen bg-white flex items-center overflow-hidden">
        
        <!-- ฝั่งซ้าย: รูปภาพชิดขอบจอ-->
        <div class="hidden md:block w-1/2 relative h-full">
            <img src="./img/IMG_5974 2 (1).png" alt="SE Wall" class="w-full h-full object-cover object-right">
            <div class="absolute inset-y-0 right-0 w-32 md:w-56 bg-gradient-to-r from-transparent to-white"></div>
        </div>

        <!-- เนื้อหาฝั่งขวา -->
        <div class="w-full md:w-1/2 h-full flex flex-col justify-center px-8 md:px-16 lg:px-24 relative z-10">
            
            <div class="w-full max-w-md mx-auto"></div>
            
            <div class="p-12 md:p-20 bg-white/90 md:bg-transparent backdrop-blur-sm md:backdrop-blur-none rounded-2xl md:rounded-none p-6 md:p-0">
                <a href="index.html" class="inline-flex items-center text-gray-500 hover:text-gray-800 font-medium mb-12 transition group">
                    <svg class="w-10 h-10 mr-2 text-gray-400 group-hover:text-gray-600 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    กลับสู่หน้าหลัก
                </a>
                
                <h1 class="text-3xl font-medium mb-2 leading-tight">เข้าสู่ระบบ</h1>
                <p class="text-lg font-medium mb-10 text-[15px]">สำหรับนักศึกษาที่ลงทะเบียนแล้ว</p>
                <form id="login-form" action="#" method="POST" class="space-y-6">
                    
                    <div>
                        <label for="email" class="block text-gray-900 font-medium mb-2">Email</label>
                        <input type="email" id="email" placeholder="Enter you email" 
                            class="w-full px-5 py-4 rounded-2xl border border-gray-200 shadow-[0_0px_10px_rgba(0,0,0,0.25)] focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition text-gray-700 placeholder-gray-400">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-gray-900 font-medium mb-2">Password</label>
                        <input type="password" id="password" placeholder="Enter you password" 
                            class="w-full px-5 py-4 rounded-2xl border border-gray-200 shadow-[0_0px_10px_rgba(0,0,0,0.25)] focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition text-gray-700 placeholder-gray-400">
                        <p id="loginError" class="text-xs text-red-500 mt-4"></p>
                    </div>
                    
                    <div class="pt-4">
                        <button type="submit" 
                            class="w-full bg-[#10b981] hover:bg-emerald-600 text-white font-medium text-base py-4 rounded-2xl transition shadow-md hover:shadow-lg">
                            เข้าสู่ระบบ
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </section>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
